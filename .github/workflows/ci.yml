# Continuous integration. On every pull request (and every push to main),
# GitHub starts a clean Linux machine, installs exactly the dependency
# versions locked in package-lock.json, and runs every quality check.
# A failing check means the change isn't ready to merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    # The type-check and build steps load next.config.ts, which validates
    # environment variables, so they fail without these. CI only compiles the
    # app and never connects to Supabase, so obvious placeholders are correct
    # here. Real values live in the Vercel project settings.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
